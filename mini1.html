<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Personal Profile</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(135deg, #050b1e, #0b163a);

            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        .card {
            width: 420px;
            background-color: #0f1c3f;
            padding: 32px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
        }

        img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #1f3c88;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 24px;
            margin: 10px 0 4px;
            color: #ffffff;
            font-weight: 600;
        }

        .subtitle {
            font-size: 14px;
            color: #9bb0ff;
            margin-bottom: 18px;
        }

        p {
            font-size: 14px;
            color: #d6dbff;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        h2 {
            font-size: 18px;
            color:#ffffff;
            margin-bottom: 16px;
            font-weight: 500;
        }

        input, textarea {
            width: 100%;
            padding: 11px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 14px;
            background-color: #182a5a;
            color: #ffffff;
        }

        input::placeholder,
        textarea::placeholder {
            color: #aab3ff;
        }

        textarea {
            resize: none;
            height: 90px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;

            background: linear-gradient(135deg, #1f5eff, #3b82f6);
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

<div class="card">

    <img src="profile.jpg" alt="Profile Picture">

    <h1>Elham Seid Ahmed</h1>

    <div class="subtitle">Software Engineering Student</div>

    <p>
        I am a software engineering student passionate about technology and
        continuous learning. I enjoy building web projects and exploring how
        software can solve real-world problems.
    </p>

    <h2>Contact Me</h2>

    <form onsubmit="showMessage(); return false;">
        <input type="text" placeholder="Your Name" required>
        <input type="email" placeholder="Your Email" required>
        <textarea placeholder="Your Message" required></textarea>
        <button type="submit">Send Message</button>
    </form>

</div>

<script>
    function showMessage() {
        alert("Thank you! Your message has been sent.");
        document.querySelector("form").reset();
    }
</script>
</body>
</html>
